services:
  db:
    image: dhi.io/pgvector:pg18
    environment:
      POSTGRES_PASSWORD: passwd
    volumes:
      - pgvector-data:/var/lib/postgresql
    ports:
      - "5431:5432"
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  pgvector-data:
  qdrant-data:
